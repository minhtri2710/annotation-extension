<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotation capture</title>
  </head>
  <body class="annotation-page--popup">
    <main class="annotation-page__card">
      <h1 style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0">Annotation Extension</h1>
      <p id="page-count" class="annotation-page__status"></p>
      <div class="annotation-page__actions">
        <button id="toggle" type="button" disabled>Start annotating</button>
        <button id="export" type="button">Export JSON (all pages)</button>
        <button id="export-markdown" type="button">Export Markdown (all pages)</button>
        <button id="import" type="button">Import JSON</button>
      </div>
      <p id="shortcut-hint" class="annotation-page__status" hidden></p>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <p id="status" class="annotation-page__status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotation capture</title>
  </head>
  <body class="annotation-page--popup">
    <main class="annotation-page__card">
      <header class="annotation-page__header">
        <h1>Annotations</h1>
        <p id="page-count" class="annotation-page__status"></p>
      </header>
      <button id="toggle" type="button" data-variant="primary" disabled>Start annotating</button>
      <p id="shortcut-hint" class="annotation-page__status" hidden></p>
      <button id="toolbar-toggle" type="button" role="switch" aria-checked="false" class="annotation-page__switch" disabled><span>Show toolbar on this tab</span><span class="annotation-page__switch-track" aria-hidden="true"></span></button>
      <section class="annotation-page__group">
        <div class="annotation-page__group-head">
          <h2>All pages</h2>
          <button id="import" type="button" data-variant="quiet" aria-label="Import JSON">Import</button>
        </div>
        <div class="annotation-page__actions">
          <button id="export" type="button" aria-label="Export JSON">JSON</button>
          <button id="export-markdown" type="button" aria-label="Export Markdown">Markdown</button>
        </div>
      </section>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <p id="status" class="annotation-page__status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

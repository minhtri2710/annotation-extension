<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotation settings</title>
  </head>
  <body class="annotation-page--options">
    <main class="annotation-page__card">
      <h1>Annotation settings</h1>
      <label class="annotation-page__toggle">
        <input id="enabled" type="checkbox" />
        Enable annotations
      </label>

      <form id="allowlist-form" class="annotation-page__form">
        <label for="allowlist-entry">Allowed site</label>
        <input id="allowlist-entry" type="text" placeholder="example.com" />
        <button type="submit">Add site</button>
        <p id="allowlist-error" role="alert"></p>
      </form>

      <ul id="allowlist" class="annotation-page__list"></ul>
      <button id="save" type="button">Save settings</button>
      <p id="status" class="annotation-page__status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

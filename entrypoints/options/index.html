<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotation settings</title>
  </head>
  <body>
    <main>
      <h1>Annotation settings</h1>
      <label>
        <input id="enabled" type="checkbox" />
        Enable annotations
      </label>

      <form id="allowlist-form">
        <label for="allowlist-entry">Allowed site</label>
        <input id="allowlist-entry" type="text" placeholder="example.com" />
        <button type="submit">Add site</button>
      </form>

      <ul id="allowlist"></ul>
      <button id="save" type="button">Save settings</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
